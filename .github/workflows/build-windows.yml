name: Build portable Windows app

on:
  push:
    branches: ["main", "master", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Build SnapVanish.exe
        run: >
          pyinstaller --noconfirm --windowed --name SnapVanish
          --collect-data mediapipe --collect-binaries mediapipe
          --collect-all pyvirtualcam
          main.py

      - name: Smoke-test the packaged exe (loads MediaPipe models)
        shell: pwsh
        run: |
          $p = Start-Process dist\SnapVanish\SnapVanish.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Assemble portable folder
        shell: pwsh
        run: |
          Copy-Item -Recurse browser_extension dist\SnapVanish\browser_extension
          Copy-Item QUICKSTART.txt dist\SnapVanish\
          Compress-Archive -Path dist\SnapVanish -DestinationPath SnapVanish-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SnapVanish-windows
          path: dist/SnapVanish

      - name: Attach zip to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SnapVanish-windows.zip
